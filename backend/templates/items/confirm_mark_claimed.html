{% extends 'base.html' %}
{% block title %}Mark as Claimed — {{ item.title }}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 560px;">
  <div class="card border-0 shadow-sm rounded-4 p-4 text-center animate-in">
    <div class="mb-3">
      <div class="mx-auto mb-3" style="width:64px;height:64px;border-radius:50%;background:#e8f5e9;display:flex;align-items:center;justify-content:center;">
        <i class="bi bi-check-circle-fill text-success fs-2"></i>
      </div>
      <h1 class="h5 fw-bold mb-1">Mark as Claimed</h1>
      <p class="text-muted small">
        You are confirming that the owner has <strong>retrieved this item</strong>. This will close the lost report.
      </p>
    </div>
    <div class="card bg-light border-0 rounded-3 p-3 mb-4 text-start">
      <div class="fw-semibold text-dark mb-1">{{ item.title }}</div>
      <small class="text-muted"><i class="bi bi-geo-alt me-1"></i>{{ item.location }}</small>
    </div>
    <div class="d-flex gap-2 justify-content-center">
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success fw-semibold px-4">
          <i class="bi bi-check-circle me-1"></i>Yes, Mark as Claimed
        </button>
      </form>
      <a href="{% url 'items:item_detail' item.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
