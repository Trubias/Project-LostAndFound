{% extends 'base.html' %}
{% block title %}Check Your Email{% endblock %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="auth-wrapper"><div class="auth-card animate-in text-center">
  <div class="auth-logo"><i class="bi bi-envelope-check-fill"></i></div>
  <h1 class="auth-title">Check your email</h1>
  <p class="auth-subtitle">If an active account matches that address, password reset instructions are on the way.</p>
  <a class="btn btn-outline-primary w-100" href="{% url 'accounts:login' %}">Back to sign in</a>
</div></div>
{% endblock %}
