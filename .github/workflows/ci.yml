name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: findly_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d findly_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: 'True'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/findly_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: Check PostgreSQL migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django suite on PostgreSQL
        working-directory: backend
        run: python manage.py test

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Django configuration
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
        run: python manage.py check

      - name: Check migration consistency
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
        run: python manage.py test

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Node dependencies
        working-directory: frontend
        run: npm audit

      - name: Build frontend
        working-directory: frontend
        env:
          DJANGO_URL: http://127.0.0.1:8000
        run: npm run build
